name: data-release

on:
  schedule:
    - cron: '0 6 * * 1'
  push:
    branches: [main]
    paths:
      - 'src/db/schema.ts'
      - 'curated/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: .data/cache
          key: sources-${{ github.run_id }}
          restore-keys: sources-
      - name: Build release assets
        id: build
        run: |
          set -o pipefail
          node --max-old-space-size=3072 src/entry/release.mjs --out out | tee build.log
          echo "tag=$(tail -n 1 build.log)" >> "$GITHUB_OUTPUT"
      - name: Replace an existing release with the same tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.build.outputs.tag }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
          fi
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.build.outputs.tag }}
        run: gh release create "$TAG" out/* --prerelease --latest=false --title "Data $TAG" --notes-file out/CREDITS.md
      - name: Prune old releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: node src/release/prune.ts
