# Curated creative part uses: parts that builders commonly use for something
# other than their original purpose. Every entry starts as reviewed: false and
# is shown to users only as a "suggestion" until a person reviews it.
#
# Entries are grouped by part, most common parts first. Keep "represents" to a
# short lowercase noun phrase, and reuse existing wording (for example "eye",
# "light", "spike") so searches group well.

