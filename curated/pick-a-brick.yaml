# in a browser. The seed loads these into the pick_a_brick table, so pick_a_brick_list starts from
# them instead of a guess and get_part shows them on each color.
#
#   part:    Rebrickable part number.
#   color:   Rebrickable color id; leave it out when the entry holds for every color.
