# Color families for the brick-art parts database.
#
# Format: families: { <family>: [<Rebrickable color id>, ...] }
# Families: black, white, gray, red, orange, yellow, green, blue, purple, pink,
# brown, tan, transparent, metallic, other.
# Every color id appears under exactly one family. Colors not listed here
# get the family "other" at seed time.
